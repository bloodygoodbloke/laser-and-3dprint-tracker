# Applied once by infra/setup.sh via `az containerapp update --yaml` (after envsubst).
# CI only changes the image afterwards, so volumes/mounts are preserved.
properties:
  template:
    containers:
      - name: workshoptrack
        image: ${IMAGE}
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: NODE_ENV
            value: production
          - name: PORT
            value: "4000"
          - name: DATABASE_URL
            value: file:/data/makerflow.db
          - name: UPLOAD_DIR
            value: /data/uploads
          # Uploads live in Blob Storage (managed identity, no keys). UPLOAD_DIR is only the local fallback.
          - name: STORAGE_PROVIDER
            value: azure
          - name: AZURE_STORAGE_ACCOUNT
            value: ${AZURE_STORAGE_ACCOUNT}
          - name: AZURE_STORAGE_CONTAINER
            value: uploads
        volumeMounts:
          - volumeName: data
            mountPath: /data
        # Startup runs `prisma migrate deploy` against SQLite on Azure Files, so allow up to ~5 minutes.
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          - type: Liveness
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
    volumes:
      - name: data
        storageType: AzureFile
        storageName: makerflow-data
        # nobrl: disable SMB byte-range locks, required for SQLite on Azure Files
        mountOptions: nobrl,mfsymlinks
    scale:
      minReplicas: 0   # scale-to-zero = no idle compute cost; set 1 to avoid cold starts
      maxReplicas: 1   # SQLite must have a single writer
