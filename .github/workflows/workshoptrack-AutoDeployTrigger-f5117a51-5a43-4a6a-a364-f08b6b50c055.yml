name: Trigger auto deployment for workshoptrack

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/workshoptrack-AutoDeployTrigger-f5117a51-5a43-4a6a-a364-f08b6b50c055.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WORKSHOPTRACK_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WORKSHOPTRACK_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WORKSHOPTRACK_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ secrets.WORKSHOPTRACK_REGISTRY_URL }}
          registryUsername: ${{ secrets.WORKSHOPTRACK_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WORKSHOPTRACK_REGISTRY_PASSWORD }}
          containerAppName: workshoptrack
          resourceGroup: ACA-WST
          imageToBuild: ${{ secrets.WORKSHOPTRACK_REGISTRY_URL }}/workshoptrack:${{ github.sha }}
