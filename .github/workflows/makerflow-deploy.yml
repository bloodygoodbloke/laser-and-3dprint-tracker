name: Deploy MakerFlow to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: makerflow-deploy
  cancel-in-progress: false   # never interrupt a deploy that is mid-flight

permissions:
  id-token: write   # GitHub OIDC
  contents: read

env:
  ACR_NAME: makerflowacr
  ACR_SERVER: makerflowacr-bwd0fkhdedg4bva5.azurecr.io
  IMAGE_NAME: makerflow
  RESOURCE_GROUP: ACA-WST
  CONTAINER_APP: workshoptrack

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The CI identity only has data-plane (AcrPush) rights, so it can't look the registry up by name;
      # exchange the Entra login for an ACR token against the full login server instead.
      - name: Log in to ACR
        run: |
          TOKEN=$(az acr login --name "$ACR_SERVER" --expose-token --query accessToken -o tsv)
          echo "$TOKEN" | docker login "$ACR_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - uses: docker/setup-buildx-action@v4

      - name: Compute build metadata
        run: |
          echo "APP_VERSION=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            APP_ENVIRONMENT=Production
          tags: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image and the version env vars change; volumes, mounts, other env vars and the /data share are untouched.
      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --revision-suffix "g${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" \
            --set-env-vars \
              "APP_VERSION=$APP_VERSION" "BUILD_NUMBER=$BUILD_NUMBER" "GIT_COMMIT=$GIT_COMMIT" \
              "GIT_BRANCH=$GIT_BRANCH" "BUILD_DATE=$BUILD_DATE" "APP_ENVIRONMENT=Production"

      # Best effort: warns (does not fail the deploy) if /api/version does not report this commit.
      - name: Verify deployed version
        continue-on-error: true
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in 1 2 3 4 5 6; do
            DEPLOYED=$(curl -fsS "https://$FQDN/api/version" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).gitCommit" || true)
            if [ "$DEPLOYED" = "${GIT_COMMIT::7}" ]; then
              echo "Deployed commit $DEPLOYED matches build $BUILD_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Expected commit ${GIT_COMMIT::7} but /api/version reported '${DEPLOYED}'"
          exit 1
