name: Deploy MakerFlow to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: makerflow-deploy
  cancel-in-progress: false   # never interrupt a deploy that is mid-flight

permissions:
  id-token: write   # GitHub OIDC
  contents: read

env:
  ACR_NAME: makerflowacr
  ACR_SERVER: makerflowacr-bwd0fkhdedg4bva5.azurecr.io
  IMAGE_NAME: makerflow
  RESOURCE_GROUP: ACA-WST
  CONTAINER_APP: workshoptrack

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The CI identity only has data-plane (AcrPush) rights, so it can't look the registry up by name;
      # exchange the Entra login for an ACR token against the full login server instead.
      - name: Log in to ACR
        run: |
          TOKEN=$(az acr login --name "$ACR_SERVER" --expose-token --query accessToken -o tsv)
          echo "$TOKEN" | docker login "$ACR_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the image changes; volumes, mounts, env vars and the /data share are untouched.
      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --revision-suffix "g${GITHUB_SHA::7}"
