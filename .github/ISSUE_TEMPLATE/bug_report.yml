name: Bug Report
description: Something in MakerFlow is not working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead. Mention the tab or workflow involved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 Critical
        - P1 High
        - P2 Medium
        - P3 Low
      default: 2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: Shown in the footer and on Help > Deployment Information (use "Copy for support").
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build Number
      placeholder: "20261031.1545"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Test
        - Development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 130 on macOS
